<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Admin - Printer Lab Telkom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
    // Backend Cloudflare Tunnel URL (Auto-Updated)
    const SERVER_URL = 'https://dollar-oliver-collar-filter.trycloudflare.com';

    const DEFAULT_PASS = 'telkom kaya';
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const loginForm = document.getElementById('loginForm');
    const adminPasswordInput = document.getElementById('adminPasswordInput');
    const loginErrorMsg = document.getElementById('loginErrorMsg');
    const btnLogout = document.getElementById('btnLogout');

    function checkAuth() {
      if (sessionStorage.getItem('lab_telkom_admin_auth') === 'true') {
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        btnLogout.classList.remove('hidden');
        loadHistory();
        updateAdminPrinterUI();
        renderPendingOrders();
      } else {
        loginSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
        btnLogout.classList.add('hidden');
      }
    }

    if(loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (adminPasswordInput.value.trim() === DEFAULT_PASS) {
          sessionStorage.setItem('lab_telkom_admin_auth', 'true');
          loginErrorMsg.classList.add('hidden');
          checkAuth();
        } else {
          loginErrorMsg.classList.remove('hidden');
        }
      });
    }
    if(btnLogout) {
      btnLogout.addEventListener('click', () => { sessionStorage.removeItem('lab_telkom_admin_auth'); checkAuth(); });
    }

    // Status Printer
    const adminPrinterStatusBadge = document.getElementById('adminPrinterStatusBadge');
    const adminPrinterStatusDesc = document.getElementById('adminPrinterStatusDesc');
    const adminPrinterIconBg = document.getElementById('adminPrinterIconBg');
    
    async function updateAdminPrinterUI() {
      if(!adminPrinterStatusBadge) return;
      try {
        const res = await fetch(SERVER_URL + '/api/info');
        if (res.ok) {
          const data = await res.json();
          adminPrinterStatusBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800';
          adminPrinterStatusBadge.textContent = '?? ONLINE (' + data.selectedPrinter + ')';
          adminPrinterStatusDesc.textContent = 'Server Lab menyala dan siap mencetak.';
          adminPrinterIconBg.className = 'w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl font-bold';
        } else {
          throw new Error('Offline');
        }
      } catch(e) {
          adminPrinterStatusBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-800';
          adminPrinterStatusBadge.textContent = '?? OFFLINE / TERPUTUS';
          adminPrinterStatusDesc.textContent = 'Koneksi ke Server Lab terputus. Pastikan start-kiosk.bat berjalan.';
          adminPrinterIconBg.className = 'w-12 h-12 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center text-2xl font-bold';
      }
    }

    // Pending Orders
    const pendingOrdersContainer = document.getElementById('pendingOrdersContainer');
    const pendingBadgeCount = document.getElementById('pendingBadgeCount');
    const btnRefreshPending = document.getElementById('btnRefreshPending');

    async function renderPendingOrders() {
      if (!pendingOrdersContainer) return;
      try {
        const res = await fetch(SERVER_URL + '/api/pending-orders');
        if (!res.ok) return;
        const pending = await res.json();
        
        pendingBadgeCount.textContent = pending.length + ' Menunggu';
        if (pending.length > 0) {
          pendingBadgeCount.className = "px-3 py-1 bg-red-100 text-red-800 rounded-full text-xs font-black animate-pulse";
        } else {
          pendingBadgeCount.className = "px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-semibold";
          pendingOrdersContainer.innerHTML = '<div class="p-8 text-center text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200"><p class="text-2xl mb-1">?</p><p class="text-xs font-semibold text-slate-600">Tidak ada antrean pesanan saat ini.</p></div>';
          return;
        }

        let html = '';
        pending.forEach(item => {
          html += '<div class="p-4 bg-gradient-to-r from-amber-50/50 to-orange-50/30 border-2 border-amber-200 hover:border-amber-400 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 transition shadow-sm">';
          html += '<div class="flex items-center space-x-3 flex-1">';
          html += '<div class="w-12 h-12 bg-amber-100 text-amber-800 rounded-xl flex items-center justify-center font-mono font-black text-sm">???</div>';
          html += '<div>';
          html += '<span class="font-mono font-black text-base text-slate-900">' + item.orderId + '</span>';
          html += ' <span class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold animate-pulse">Menunggu Validasi</span>';
          html += '<p class="text-xs text-slate-600 mt-0.5 font-medium truncate">' + (item.fileName||'-') + ' � <b>' + item.pages + ' Hal</b> (' + (item.copies || 1) + 'x copy)</p>';
          html += '<p class="text-xs font-black text-emerald-700 mt-0.5">Total Tagihan: Rp ' + (item.totalCost || 0).toLocaleString('id-ID') + '</p>';
          html += '</div></div>';
          html += '<div class="flex items-center space-x-2 w-full sm:w-auto">';
          html += '<button onclick="executeRejectOrder(\'' + item.orderId + '\')" class="px-3 py-2.5 bg-red-100 hover:bg-red-200 text-red-700 font-bold text-xs rounded-xl">? Tolak</button>';
          html += '<button onclick="executeDirectValidation(\'' + item.orderId + '\')" class="flex-1 sm:flex-initial px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs rounded-xl shadow-md">?? Validasi & Cetak</button>';
          html += '</div></div>';
        });
        pendingOrdersContainer.innerHTML = html;
      } catch(e) {}
    }
    if (btnRefreshPending) btnRefreshPending.addEventListener('click', renderPendingOrders);
    setInterval(renderPendingOrders, 3000);

    window.executeDirectValidation = async function(orderId) {
      if (!confirm('Peringatan: Kertas akan langsung keluar di printer Lab sekarang! Lanjutkan?')) return;
      try {
        const res = await fetch(SERVER_URL + '/api/simulate-pay/' + orderId, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          alert('? Sukses! Server Lab sedang memproses pencetakan dokumen ke EPSON secara instan.');
          renderPendingOrders();
          
          const history = JSON.parse(localStorage.getItem('lab_telkom_history') || '[]');
          history.unshift({
            date: new Date().toLocaleString('id-ID'),
            orderId: orderId, fileName: '-', pages: 1, totalCost: 0,
            tokenUsed: 'SERVER SILENT PRINT', status: 'SUKSES'
          });
          localStorage.setItem('lab_telkom_history', JSON.stringify(history));
          loadHistory();
        } else {
          alert('Gagal: ' + data.error);
        }
      } catch(e) { alert('Gagal terhubung ke Server Lab.'); }
    }

    window.executeRejectOrder = async function(orderId) {
      if (!confirm('Tolak pesanan ' + orderId + '?')) return;
      try {
        await fetch(SERVER_URL + '/api/reject/' + orderId, { method: 'POST' });
        renderPendingOrders();
      } catch(e) {}
    }

    const historyTableBody = document.getElementById('historyTableBody');
    const statTotalOrders = document.getElementById('statTotalOrders');
    function loadHistory() {
      if(!historyTableBody) return;
      const history = JSON.parse(localStorage.getItem('lab_telkom_history') || '[]');
      if(statTotalOrders) statTotalOrders.textContent = history.length;
      if (history.length === 0) {
        historyTableBody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400">Belum ada transaksi.</td></tr>';
        return;
      }
      let html = '';
      history.forEach(item => {
        html += '<tr class="hover:bg-slate-50"><td class="py-3 px-3 text-[11px]">' + item.date + '</td>';
        html += '<td class="py-3 px-3 font-bold">' + item.orderId + '</td>';
        html += '<td class="py-3 px-3 font-semibold">' + item.fileName + '</td>';
        html += '<td class="py-3 px-3">' + item.pages + ' Hal</td>';
        html += '<td class="py-3 px-3 font-bold">Rp ' + (item.totalCost||0).toLocaleString('id-ID') + '</td>';
        html += '<td class="py-3 px-3 font-bold text-emerald-700">' + item.tokenUsed + '</td>';
        html += '<td class="py-3 px-3"><span class="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full">SELESAI</span></td></tr>';
      });
      historyTableBody.innerHTML = html;
    }
    
    const btnClearHistory = document.getElementById('btnClearHistory');
    if(btnClearHistory) {
      btnClearHistory.addEventListener('click', () => {
        localStorage.removeItem('lab_telkom_history'); loadHistory();
      });
    }

    checkAuth();
  </script>
</body>
</html>
